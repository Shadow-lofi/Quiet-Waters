<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/quiet-waters.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Quiet Waters — a Christian meditation timer. Be still before God with gentle chimes, Scripture to dwell on, and breath-prayer pacing."
    />
    <meta name="theme-color" content="#0e1b24" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef4f7" media="(prefers-color-scheme: light)" />

    <!-- Open Graph / Twitter -->
    <meta property="og:site_name" content="Quiet Waters" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Quiet Waters · Christian Meditation Timer" />
    <meta
      property="og:description"
      content="Be still and know that He is God. A quiet timer for Scripture meditation and breath prayer."
    />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Quiet Waters" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Quiet Waters · Christian Meditation Timer</title>

    <!-- Apply the saved appearance before first paint so there's no flash of the
         wrong theme. Kept in sync with src/lib/theme.ts. -->
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('quiet-waters-v1')
          var state = {}
          try {
            state = raw ? JSON.parse(raw).state || {} : {}
          } catch (e) {}
          var root = document.documentElement

          // Appearance — Cycle is the default, so first paint (before any saved
          // pref) follows the local time of day.
          var pref = state.theme || 'cycle'
          var h = new Date().getHours()
          var dark =
            pref === 'night' ||
            (pref === 'auto' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches) ||
            (pref === 'cycle' && !(h >= 6 && h < 19))
          if (dark) {
            root.dataset.theme = 'night'
            root.style.colorScheme = 'dark'
          }

          // Motion — default 'on' so the gentle animations show everywhere; a
          // visitor can choose 'system' (follow device) or 'off' in Settings.
          var motion = state.motion || 'on'
          var reduce =
            motion === 'off' ||
            (motion !== 'on' &&
              window.matchMedia &&
              window.matchMedia('(prefers-reduced-motion: reduce)').matches)
          root.dataset.motion = reduce ? 'reduce' : 'full'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
