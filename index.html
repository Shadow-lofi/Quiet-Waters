<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/quiet-waters.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Quiet Waters — a Christian meditation timer. Be still before God with gentle chimes, Scripture to dwell on, and breath-prayer pacing."
    />
    <meta name="theme-color" content="#0e1b24" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef4f7" media="(prefers-color-scheme: light)" />

    <!-- Open Graph / Twitter -->
    <meta property="og:site_name" content="Quiet Waters" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Quiet Waters · Christian Meditation Timer" />
    <meta
      property="og:description"
      content="Be still and know that He is God. A quiet timer for Scripture meditation and breath prayer."
    />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Quiet Waters" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Quiet Waters · Christian Meditation Timer</title>

    <!-- Apply the saved appearance before first paint so there's no flash of the
         wrong theme. Kept in sync with src/lib/theme.ts. -->
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('quiet-waters-v1')
          // Night is the default look, so first paint (before any saved pref) is dark.
          var pref = (raw ? (JSON.parse(raw).state || {}).theme : 'night') || 'night'
          var dark =
            pref === 'night' ||
            (pref === 'auto' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            document.documentElement.dataset.theme = 'night'
            document.documentElement.style.colorScheme = 'dark'
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
