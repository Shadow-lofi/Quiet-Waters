    <!-- Structured data so search engines understand what Quiet Waters is. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Quiet Waters",
        "url": "https://quiet-waters-meditation.com/",
        "description": "A Christian meditation timer — be still before God with Scripture to dwell on, a gentle breathing guide, and soft chimes. Free, private, and works offline.",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Any (installable Progressive Web App)",
        "browserRequirements": "Requires a modern web browser",
        "isAccessibleForFree": true,
        "inLanguage": "en",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Quiet Waters" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Quiet Waters · Christian Meditation Timer</title>

    <!-- Apply the saved appearance before first paint so there's no flash of the
         wrong theme. Kept in sync with src/lib/theme.ts. -->
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('quiet-waters-v1')
          var state = {}
          try {
            state = raw ? JSON.parse(raw).state || {} : {}
          } catch (e) {}
          var root = document.documentElement

          // Appearance — Cycle is the default, so first paint (before any saved
          // pref) follows the local time of day.
          var pref = state.theme || 'cycle'
          var h = new Date().getHours()
          var dark =
            pref === 'night' ||
            (pref === 'auto' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches) ||
            (pref === 'cycle' && !(h >= 6 && h < 19))
          if (dark) {
            root.dataset.theme = 'night'
            root.style.colorScheme = 'dark'
          }

          // Motion — default 'on' so the gentle animations show everywhere; a
          // visitor can choose 'system' (follow device) or 'off' in Settings.
          var motion = state.motion || 'on'
          var reduce =
            motion === 'off' ||
            (motion !== 'on' &&
              window.matchMedia &&
              window.matchMedia('(prefers-reduced-motion: reduce)').matches)
          root.dataset.motion = reduce ? 'reduce' : 'full'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
